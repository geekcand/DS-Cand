<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canned Tool - Admin</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3685/3685367.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#0d1020;color:#eee;font-family:Arial,sans-serif;padding:28px;direction:ltr}
.wrap{max-width:1050px;margin:auto}
h1{margin:0 0 6px}.sub{color:#9da5b5;margin-bottom:22px}
.card{background:#151a2c;border:1px solid #29304a;border-radius:14px;padding:18px;margin-bottom:16px}
h3{margin-top:0;color:#7ee2a8;font-size:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #272d42;font-size:14px}
.badge{padding:4px 8px;border-radius:8px;background:#252b40}
button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin-right:5px;font-family:inherit;font-weight:bold}
.approve{background:#173d2d;color:#7ee2a8}.reject{background:#482126;color:#ff9b9b}
.primary-btn{background:#6fe3d9;color:#0c0d16;width:100%;margin-top:10px;padding:12px}
.primary-btn:hover{filter:brightness(1.08)}
#msg{min-height:22px;color:#7ee2a8;margin-bottom:12px;font-weight:bold}
.muted{color:#9299aa}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#9da5b5;margin-bottom:5px}
.form-control{width:100%;background:#0d1020;border:1px solid #29304a;border-radius:8px;padding:10px;color:#eee;font-family:inherit;font-size:14px;box-sizing:border-box}
.form-control:focus{border-color:#6fe3d9;outline:none}
textarea.form-control{resize:vertical;min-height:90px}
</style>
</head>
<body oncontextmenu="return false;">
<div class="wrap">
  <h1>Canned Tool Admin</h1>
  <div class="sub">User management and canned Upload</div>
  <div id="msg"></div>

  <!-- Excel Upload Card with Exact Row Ordering -->
  <div class="card" style="border: 1px dashed #b18cff;">
    <h3>📊 Excel Upload (Update sheets )</h3>
    <p style="font-size: 12px; color: #9da5b5; margin-top: 0;">Select the Excel file</p>
    <div class="form-group">
      <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls">
    </div>
    <button type="button" id="uploadExcelBtn" class="primary-btn" style="background: linear-gradient(135deg,#6fe3d9,#b18cff);">Read & Upload Excel Sheet 🚀</button>
  </div>

  <!-- Add Single Canned Item Card -->
  <div class="card">
    <h3>➕ Add Canned </h3>
    <form id="addCannedForm">
      <div class="form-group">
        <label for="sheetName">Sheet section</label>
        <input type="text" id="sheetName" class="form-control" placeholder="e.g. Sales DSL or Chatting & Idle" required>
      </div>
      <div class="form-group">
        <label for="cannedTitle">Canned Name</label>
        <input type="text" id="cannedTitle" class="form-control" placeholder="e.g. Basic Packages" required>
      </div>
      <div class="form-group">
        <label for="cannedContent"> Canned Content</label>
        <textarea id="cannedContent" class="form-control" placeholder="Type canned content here..." required></textarea>
      </div>
      <button type="submit" id="addBtn" class="primary-btn">Save & Add Canned Item</button>
    </form>
  </div>

  <!-- Users Management Card -->
  <div class="card">
    <h3>👥 User Permissions Management</h3>
    <table>
      <thead><tr><th>Email</th><th>Activity</th><th>Status</th><th>Role</th><th>Created At</th><th>Actions</th></tr></thead>
      <tbody id="users"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
['contextmenu'].forEach(evt => {
  window.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    return false;
  }, { capture: true });
});

['keydown', 'keypress'].forEach(evt => {
  window.addEventListener(evt, e => {
    const isCtrl = e.ctrlKey || e.metaKey;
    const key = (e.key || '').toLowerCase();
    const code = e.code || '';
    const isSave = isCtrl && (key === 's' || key === 'س' || code === 'KeyS' || e.keyCode === 83);
    const isPrint = isCtrl && (key === 'p' || key === 'ح' || code === 'KeyP' || e.keyCode === 80);
    const isViewSource = isCtrl && (key === 'u' || key === 'ع' || code === 'KeyU' || e.keyCode === 85);
    const isDevTools = e.key === 'F12' || (isCtrl && e.shiftKey && ['i', 'j', 'c', 'I', 'J', 'C'].includes(e.key));

    if (isSave || isPrint || isViewSource || isDevTools) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      return false;
    }
  }, { capture: true });
});

window.addEventListener('beforeprint', e => {
  e.preventDefault();
  return false;
});

const SUPABASE_URL = 'https://jdvkzdorjthljhwqmvmn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6WQHg-zL775jpFaErofLog_1kd5X6bI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const users = document.getElementById('users'), msg = document.getElementById('msg');
const addCannedForm = document.getElementById('addCannedForm');
const addBtn = document.getElementById('addBtn');
const uploadExcelBtn = document.getElementById('uploadExcelBtn');

async function checkAuthWithRetry() {
  msg.style.color = '#7ee2a8';
  msg.textContent = 'Verifying session and permissions...';

  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    await new Promise(resolve => setTimeout(resolve, 600));
    let retry = await sb.auth.getSession();
    session = retry.data.session;
  }

  if (!session) {
    msg.style.color = '#ff9b9b';
    msg.textContent = 'Not logged in, redirecting to login page...';
    setTimeout(() => { location.href = 'index.html'; }, 1200);
    return;
  }

  const { data: me, error: meErr } = await sb.from('profiles').select('role,status').eq('id', session.user.id).single();

  if (meErr || !me || me.role !== 'admin') {
    document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;color:#ff9b9b">Access denied — You are not authorized to view this admin panel</h2>';
    return;
  }

  loadUsers();
  
  // تحديث جدول المستخدمين تلقائياً في لوحة الأدمن كل 15 ثانية لرصد الأونلاين لحظياً
  setInterval(loadUsers, 15000);
}

async function loadUsers(){
  const { data, error } = await sb.from('profiles').select('id,email,status,role,created_at,last_seen').order('created_at',{ascending:true});
  if(error){ msg.style.color='#ff9b9b'; msg.textContent='Failed to load user accounts.'; return; }
  
  users.innerHTML='';
  const now = Date.now();

  (data||[]).forEach(u=>{
    const tr=document.createElement('tr');
    
    // حساب حالة الاتصال (أونلاين إذا كان التحديث خلال آخر 3 دقائق)
    let onlineStatus = '<span style="color:#9299aa">⚪ Offline</span>';
    if (u.last_seen) {
      const diffMinutes = (now - new Date(u.last_seen).getTime()) / (1000 * 60);
      if (diffMinutes <= 3) {
        onlineStatus = '<span style="color:#7ee2a8; font-weight:bold;">🟢 Online</span>';
      }
    }

    const actions = u.role==='admin' ? '<span class="muted">System Admin</span>' :
      (u.status==='pending' ? `<button class="approve" data-id="${u.id}" data-status="approved">Approve</button>
       <button class="reject" data-id="${u.id}" data-status="rejected">Reject</button>` :
       `<button data-id="${u.id}" data-status="${u.status==='approved'?'disabled':'approved'}">${u.status==='approved'?'Disable':'Enable'}</button>`);
       
    tr.innerHTML=`<td>${esc(u.email)}</td><td>${onlineStatus}</td><td><span class="badge">${esc(u.status)}</span></td><td>${esc(u.role)}</td><td>${new Date(u.created_at).toLocaleString()}</td><td>${actions}</td>`;
    users.appendChild(tr);
  });
  
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const {error}=await sb.rpc('set_user_status',{target_user_id:b.dataset.id,new_status:b.dataset.status});
    if(error){msg.style.color='#ff9b9b'; msg.textContent='Failed to update user status.'; b.disabled=false; return;}
    msg.style.color='#7ee2a8';
    msg.textContent='User status updated successfully.';
    loadUsers();
  });
}

uploadExcelBtn.addEventListener('click', async () => {
  const fileInput = document.getElementById('excelFile');
  if (!fileInput.files.length) {
    msg.style.color = '#ff9b9b';
    msg.textContent = '⚠️ Please select an Excel file first.';
    return;
  }

  const file = fileInput.files[0];
  uploadExcelBtn.disabled = true;
  msg.style.color = '#7ee2a8';
  msg.textContent = '📊 Reading Excel file...';

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      
      let allItems = [];
      let globalIndex = 0;

      wb.SheetNames.forEach(sheetName => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1 });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (r && r[0] && r[1]) {
            globalIndex++;
            allItems.push({
              sheet_name: sheetName,
              title: String(r[0]),
              content: String(r[1]),
              reference_url: r[2] ? String(r[2]) : null,
              click_count: r[3] ? Number(r[3]) : 0,
              row_order: globalIndex
            });
          }
        }
      });

      msg.textContent = `🔄 Updating responses and preserving exact order for ${allItems.length} items...`;
      
      await sb.from('canned_items').delete().neq('id', 0);

      const chunkSize = 100;
      for (let i = 0; i < allItems.length; i += chunkSize) {
        const chunk = allItems.slice(i, i + chunkSize);
        const { error: insertErr } = await sb.from('canned_items').insert(chunk);
        if (insertErr) throw insertErr;
      }

      msg.style.color = '#7ee2a8';
      msg.textContent = `✨ Upload completed successfully! Responses are now synced with exact Excel ordering (${allItems.length} items).`;
      fileInput.value = '';
    } catch (err) {
      console.error(err);
      msg.style.color = '#ff9b9b';
      msg.textContent = '❌ Error processing file: ' + err.message;
    } finally {
      uploadExcelBtn.disabled = false;
    }
  };
  reader.readAsArrayBuffer(file);
});

addCannedForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  addBtn.disabled = true;
  msg.style.color = '#7ee2a8';
  msg.textContent = 'Adding canned item...';

  const sheet_name = document.getElementById('sheetName').value.trim();
  const title = document.getElementById('cannedTitle').value.trim();
  const content = document.getElementById('cannedContent').value.trim();

  const { error } = await sb.from('canned_items').insert([{ sheet_name, title, content, row_order: 999999 }]);

  addBtn.disabled = false;
  if(error){
    msg.style.color = '#ff9b9b';
    msg.textContent = 'Error adding item: ' + error.message;
  } else {
    msg.style.color = '#7ee2a8';
    msg.textContent = 'Canned item added successfully and now available in the tool! 🌟';
    addCannedForm.reset();
  }
});

function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

window.addEventListener('DOMContentLoaded', checkAuthWithRetry);
</script>
</body>
</html>
